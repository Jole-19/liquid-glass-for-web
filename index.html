<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Liquid Glass for Web</title>
    <meta
      name="description"
      content="Liquid Glass for Web is a modern React component library featuring premium, production-ready UI components with glassmorphism, bold typography, and smooth animations."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Applied before first paint. Deferring the theme to React would show a
         frame of the wrong one, which on dark-to-light is a full-screen flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('lg-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {
          /* Storage is unavailable in some embedded contexts. Light stands. */
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light')
          document.documentElement.classList.add('lg-theme-light');
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Liquid Glass for Web — a glass material for the web" />
    <meta
      property="og:description"
      content="Glass that behaves like glass: saturated backdrop, asymmetric rim light, inset specular and real microtexture, plus an opt-in WebGL refraction tier."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
