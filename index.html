<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass — a glass material for the web</title>
    <meta
      name="description"
      content="A React component library built on one portable CSS glass material, with an optional WebGL refraction tier. Design tokens, adaptive contrast and accessibility built in."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Applied before first paint. Deferring the theme to React would show a
         frame of the wrong one, which on dark-to-light is a full-screen flash. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('lg-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (matchMedia('(prefers-color-scheme: light)').matches)
            theme = 'light';
        } catch (error) {
          /* Storage is unavailable in some embedded contexts. Dark stands. */
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light')
          document.documentElement.classList.add('lg-theme-light');
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Liquid Glass — a glass material for the web" />
    <meta
      property="og:description"
      content="Glass that behaves like glass: saturated backdrop, asymmetric rim light, inset specular and real microtexture, plus an opt-in WebGL refraction tier."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
