<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass — Component Showcase</title>
    <meta name="description" content="A realistic mock app showcasing every Liquid Glass component." />
    <meta name="color-scheme" content="light dark" />

    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('lg-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (matchMedia('(prefers-color-scheme: light)').matches)
            theme = 'light';
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'light')
          document.documentElement.classList.add('lg-theme-light');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mock/main.tsx"></script>
  </body>
</html>
